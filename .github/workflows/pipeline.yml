name: Sample Pipeline App CI/CD

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install --no-cache-dir ruff>=0.3.0

      - name: Run Ruff Lint
        run: ruff check app/

  unit-test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: pip install --no-cache-dir .[test]

      - name: Run Pytest
        run: pytest tests/ -v

  build-container:
    name: Container Build & Package
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build -t sample-pipeline-app:${{ github.sha }} .

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker ${{ secrets.GAR_LOCATION }} --quiet

      - name: Tag and Push Container Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sample-pipeline-app:${{ github.sha }} ${{ secrets.GAR_REPOSITORY }}/sample-pipeline-app:${{ github.sha }}
          docker push ${{ secrets.GAR_REPOSITORY }}/sample-pipeline-app:${{ github.sha }}

  deploy-cloudrun:
    name: Deploy to Cloud Run
    needs: build-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          SERVICE_NAME: sample-pipeline-app
          REGION: us-central1
          IMAGE_NAME: ${{ secrets.GAR_REPOSITORY }}/sample-pipeline-app:${{ github.sha }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: ./scripts/deploy.sh

